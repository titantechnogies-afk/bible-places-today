name: Deploy Bible Places Today to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the full Bible-places index (optional)
        run: node tools/build-gazetteer.mjs || echo "Skipped; the site loads the index on demand."
      - name: Build People of the Bible (Theographic, CC BY-SA)
        run: (git clone --depth 1 https://github.com/robertrouse/theographic-bible-metadata /tmp/theo && node tools/build-people.mjs /tmp/theo) || echo "People skipped"
      - name: Build topical Bible and dictionary
        run: (git clone --depth 1 https://github.com/BradyStephenson/bible-data /tmp/bdata && node tools/build-study.mjs /tmp/bdata /tmp/theo) || echo "Study data skipped"
      - name: Download place photographs (Wikimedia Commons)
        run: node tools/build-images.mjs || echo "Photos skipped"
      - name: Build share pictures
        run: pip install --quiet pillow && python3 tools/build-og.py || echo "Share pictures skipped"
      - name: Build cross-references (OpenBible.info, CC BY)
        run: node tools/build-xrefs.mjs || echo "Cross-references skipped"
      - name: Stamp file versions so phones always get matching files
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" index.html && sed -i "s/jom-v[0-9]*/jom-${GITHUB_SHA::8}/" sw.js
      - name: Shrink the app code for faster loading
        run: |
          npx -y esbuild@0.24.0 js/app.js --minify --outfile=/tmp/app.min.js && node --check /tmp/app.min.js && grep -q "viewTeachings\|function" /tmp/app.min.js && cp /tmp/app.min.js js/app.js || echo "App code left unshrunk"
          npx -y esbuild@0.24.0 css/style.css --minify --outfile=/tmp/style.min.css && cp /tmp/style.min.css css/style.css || echo "Styles left unshrunk"
      - name: Build share pages and sitemap
        run: node tools/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Give GitHub a moment to register the upload
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
