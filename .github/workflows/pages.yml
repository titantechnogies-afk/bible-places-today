name: Deploy Bible Places Today to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the full Bible-places index (optional)
        run: node tools/build-gazetteer.mjs || echo "Skipped; the site loads the index on demand."
      - name: Build cross-references (OpenBible.info, CC BY)
        run: node tools/build-xrefs.mjs || echo "Cross-references skipped"
      - name: Build share pages and sitemap
        run: node tools/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Give GitHub a moment to register the upload
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
